---
# Extra_Vars
# aws_region, ami_id, instance_type, key_name, subnet_id, security_group_id, aap_workflow_url, aap_bearer_token
# ==============================================================================
# Play 1: AWS 上に Streamlit Web Portal 用の EC2 インスタンスを作成
# ==============================================================================
- name: Provision EC2 Instance for Streamlit Portal
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # 変数をPlaybook外部（Extra Vars / Survey / group_vars）から注入可能に切り出し
    # （AAPで指定がない場合は、default() 内の値がフォールバックとして採用されます）
    aws_region: "{{ aws_region | default('ap-northeast-1') | trim }}"
    ami_id: "{{ ami_id | default('ami-0d52744d6db51b0f1') | trim }}"
    instance_type: "{{ instance_type | default('t3.micro') | trim}}"
    key_name: "{{ key_name | default('patch-demo-key') | trim}}"
    subnet_id: "{{ subnet_id | default('subnet-xxxxxxxxxxxxxxxxx') | trim }}"
    security_group_id: "{{ security_group_id | default('sg-xxxxxxxxxxxxxxxxx') | trim }}"

  tasks:
    - name: Launch EC2 Instance
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        key_name: "{{ key_name }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        vpc_subnet_id: "{{ subnet_id }}"
        security_groups:
          - "{{ security_group_id }}"
        network_interfaces:
          - assign_public_ip: true
        tags:
          Name: "demo-web-portal"
          purpose: "patch_demo"
        wait: true
      register: ec2_result

    - name: Wait for SSH to become available
      ansible.builtin.wait_for:
        host: "{{ ec2_result.instances[0].public_ip_address }}"
        port: 22
        delay: 10
        timeout: 300

    - name: Add newly created EC2 instance to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ ec2_result.instances[0].public_ip_address }}"
        groups: "new_web_portal"
        ansible_user: "ec2-user"


# ==============================================================================
# Play 2: 作成した EC2 上で SELinux・ディレクトリ・Podman コンテナのセットアップ
# ==============================================================================
- name: Setup Streamlit Container Environment on EC2
  hosts: new_web_portal
  become: true
  gather_facts: true

  vars:
    aap_workflow_url: "{{ aap_workflow_url | default('https://0.0.0.0/api/controller/v2/workflow_job_templates/19/launch/') }}"
    aap_bearer_token: "{{ aap_bearer_token }}"
    container_image: "docker.io/rhnconsultingkemori/vulnerability-demo-portal:latest"
    test_dir: "/home/ec2-user/test"

  tasks:
    - name: Ensure Podman and SELinux management packages are installed
      ansible.builtin.dnf:
        name:
          - podman
          - policycoreutils-python-utils
        state: present

    - name: Create data directory for Streamlit portal
      ansible.builtin.file:
        path: "/home/ec2-user/data"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0777"

    - name: Create test and test/data directories for Playwright UI testing
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0755"
      loop:
        - "{{ test_dir }}"
        - "{{ test_dir }}/data"

    - name: Set SELinux file context rules for data and test directories
      ansible.builtin.command:
        cmd: "semanage fcontext -a -t container_file_t '{{ item }}(/.*)?'"
      loop:
        - "/home/ec2-user/data"
        - "{{ test_dir }}"
      register: semanage_result
      changed_when: false
      failed_when: false

    - name: Apply SELinux context to data and test directories
      ansible.builtin.file:
        path: "{{ item }}"
        setype: container_file_t
        state: directory
        recurse: true
      loop:
        - "/home/ec2-user/data"
        - "{{ test_dir }}"

    - name: Create test_wordpress.py for Playwright execution
      ansible.builtin.copy:
        dest: "{{ test_dir }}/test_wordpress.py"
        owner: ec2-user
        group: ec2-user
        mode: "0644"
        content: |
          import os
          import re
          from playwright.sync_api import sync_playwright, expect

          TARGET_URL = os.getenv("TARGET_URL", "http://localhost")

          def run_test():
              with sync_playwright() as p:
                  print(f"\n[INFO] Launching Chromium browser...")
                  browser = p.chromium.launch(
                      headless=True,
                      args=["--no-sandbox", "--disable-setuid-sandbox", "--disable-dev-shm-usage"]
                  )
                  context = browser.new_context()
                  page = context.new_page()

                  print(f"[INFO] Connecting to {TARGET_URL} ...")
                  # 1. DOMコンテンツ構築完了までロード待機（タイムアウト180秒）
                  response = page.goto(TARGET_URL, wait_until="domcontentloaded", timeout=180000)
                  print(f"[INFO] HTTP Status Code: {response.status if response else 'No Response'}")

                  # 2. サイトタイトルの検証
                  expect(page).to_have_title(re.compile(r"DemoSite", re.IGNORECASE), timeout=30000)
                  print(f"[INFO] Page title validated: '{page.title()}'")

                  # 3. body 要素が表示されるのを待ってから DB 接続エラー確認
                  page.wait_for_selector("body", timeout=30000)
                  body_text = page.inner_text("body")
                  assert "Error establishing a database connection" not in body_text, "DB接続エラーが発生しています"
                  print("[INFO] DB Connection check PASSED.")

                  # 4. スクリーンショット保存
                  os.makedirs("/output", exist_ok=True)
                  screenshot_path = "/output/wordpress_test_result.png"
                  page.screenshot(path=screenshot_path, full_page=True)
                  print(f"[INFO] Screenshot successfully saved to {screenshot_path}")

                  browser.close()

          if __name__ == "__main__":
              run_test()

    # 既存の同名コンテナがあれば安全に停止・削除
    - name: Remove existing Podman container if present
      ansible.builtin.command:
        cmd: podman rm -f vulnerability-demo-portal
      register: podman_rm_result
      changed_when: false
      failed_when: false

    # podman run コマンドでコンテナを起動
    - name: Run Streamlit Portal Podman Container
      ansible.builtin.command:
        cmd: >-
          podman run -d
          --name vulnerability-demo-portal
          -p 8501:8501
          -e AAP_WORKFLOW_URL="{{ aap_workflow_url }}"
          -e AAP_BEARER_TOKEN="{{ aap_bearer_token }}"
          -v /home/ec2-user/data:/app/data:Z
          --restart always
          {{ container_image }}
      register: podman_run_result
      changed_when: podman_run_result.rc == 0
