---
- name: Prepare Lightspeed refresh targets
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Load common remediation targets
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/load_remediation_targets.yml"

    - name: Create remediation group
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/tasks/create_remediation_group.yml"


- name: Upload refreshed system status to Red Hat Lightspeed
  hosts: canonical_remediation_targets
  gather_facts: false
  become: true
  serial: "{{ insights_upload_serial | default(5) }}"

  tasks:
    - name: Verify insights-client is installed
      ansible.builtin.command:
        argv:
          - insights-client
          - --version
      register: insights_client_version
      changed_when: false

    - name: Test connection to Red Hat Lightspeed
      ansible.builtin.command:
        argv:
          - insights-client
          - --test-connection
      register: insights_connection
      changed_when: false

    - name: Refresh package cache and upload current status
      ansible.builtin.command:
        argv:
          - insights-client
          - --build-packagecache
      register: insights_upload
      changed_when: true

    - name: Show Lightspeed upload result
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          advisories_applied: "{{ remediation_advisories }}"
          insights_client_version: >-
            {{ insights_client_version.stdout | default('unknown') }}
          upload_rc: "{{ insights_upload.rc }}"
          upload_stdout: "{{ insights_upload.stdout | default('') }}"
