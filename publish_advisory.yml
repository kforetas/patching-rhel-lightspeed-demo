---
- name: Publish remediation dataset to Git
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    git_branch: "main"
    git_commit_user_name: "AAP Automation"
    git_commit_user_email: "aap-automation@example.com"
    git_commit_message: "Update remediation dataset from Streamlit [{{ ticket_id | default('NO-TICKET') }}]"
    remediation_dataset_relative_path: "datasets/remediation_dataset.yml"

  tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - remediation_dataset is defined
          - remediation_dataset is mapping
          - remediation_dataset | length > 0
          - git_repository_url is defined
          - git_repository_url | length > 0
        fail_msg: "remediation_dataset and git_repository_url must be defined."

    - name: Create temporary publishing directory
      ansible.builtin.tempfile:
        state: directory
        prefix: remediation-publisher-
      register: publishing_temp_dir

    - name: Set publishing repository path
      ansible.builtin.set_fact:
        publishing_repo_dir: "{{ publishing_temp_dir.path }}/repository"

    - name: Create temporary SSH key file
      ansible.builtin.tempfile:
        state: file
        prefix: git-key-
      register: git_key

    # --- 鍵フォーマット完全修正タスク ---
    - name: Process and Write valid SSH Private Key
      vars:
        raw_env_key: "{{ lookup('env', 'GIT_SSH_PRIVATE_KEY_B64') }}"
      ansible.builtin.copy:
        # 生テキスト(-----BEGIN)かBase64文字列かを判定して正しく整形書き出し
        content: >-
          {{
            (raw_env_key if ('BEGIN OPENSSH PRIVATE KEY' in raw_env_key or 'BEGIN RSA PRIVATE KEY' in raw_env_key)
            else (raw_env_key | b64decode)) | trim
          }}
        dest: "{{ git_key.path }}"
        mode: "0600"
      no_log: true

    - name: Publish dataset
      environment:
        GIT_SSH_COMMAND: "ssh -i {{ git_key.path }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
      block:
        - name: Clone target Git repository
          ansible.builtin.git:
            repo: "{{ git_repository_url }}"
            dest: "{{ publishing_repo_dir }}"
            version: "{{ git_branch }}"
            key_file: "{{ git_key.path }}"
            single_branch: true
            depth: 1
            update: true
            accept_hostkey: true

        - name: Create remediation dataset parent directory
          ansible.builtin.file:
            path: "{{ publishing_repo_dir }}/{{ remediation_dataset_relative_path | ansible.builtin.dirname }}"
            state: directory
            mode: "0755"

        - name: Write remediation dataset into repository
          ansible.builtin.copy:
            content: "{{ remediation_dataset | to_nice_yaml(indent=2) }}"
            dest: "{{ publishing_repo_dir }}/{{ remediation_dataset_relative_path }}"
            mode: "0644"

        - name: Check whether remediation dataset changed
          ansible.builtin.command:
            argv:
              - git
              - status
              - --porcelain
              - --
              - "{{ remediation_dataset_relative_path }}"
            chdir: "{{ publishing_repo_dir }}"
          register: remediation_git_status
          changed_when: false

        - name: Commit and push remediation dataset
          when: remediation_git_status.stdout | length > 0
          block:
            - name: Configure repository Git author
              ansible.builtin.command:
                argv:
                  - git
                  - config
                  - --local
                  - "{{ item.key }}"
                  - "{{ item.value }}"
                chdir: "{{ publishing_repo_dir }}"
              loop:
                - { key: 'user.name', value: '{{ git_commit_user_name }}' }
                - { key: 'user.email', value: '{{ git_commit_user_email }}' }
              changed_when: false

            - name: Stage, Commit and Push
              ansible.builtin.shell: |
                git add "{{ remediation_dataset_relative_path }}"
                git commit -m "{{ git_commit_message }}"
                git push origin "HEAD:{{ git_branch }}"
              chdir: "{{ publishing_repo_dir }}"

      always:
        - name: Remove temporary publishing directory
          ansible.builtin.file:
            path: "{{ publishing_temp_dir.path }}"
            state: absent
          when: publishing_temp_dir.path is defined

        - name: Remove temporary SSH key
          ansible.builtin.file:
            path: "{{ git_key.path }}"
            state: absent
          when: git_key.path is defined
