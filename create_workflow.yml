---
# Create Workflow
# ----------------------------------------------
- name: Create a Workflow 
  hosts: localhost

  environment:
    CONTROLLER_HOST: "{{ aap_controller_url }}"
    CONTROLLER_USERNAME: "{{ ansible_user }}"
    CONTROLLER_PASSWORD: "{{ ansible_pw }}"
    CONTROLLER_VERIFY_SSL: false
    
  tasks:
    # --------------------------------------------------------------------------
    # 1. Delete and Create VMs WF (Delete -> Create)
    # --------------------------------------------------------------------------
    - name: Create Workflow - Delete and Create VMs WF
      ansible.controller.workflow_job_template:
        name: "Delete and Create VMs WF"
        state: present
        organization: "{{ organization_name }}"
        labels:
          - "{{ label_environment }}"

    - name: Create Workflow Node - Create Managed VMs
      ansible.controller.workflow_job_template_node:
        identifier: Create_VMs
        workflow_job_template: "Delete and Create VMs WF"
        unified_job_template: "Create Managed VMs"
        state: present

    - name: Create Workflow Node - Delete Managed VMs
      ansible.controller.workflow_job_template_node:
        identifier: Delete_VMs
        workflow_job_template: "Delete and Create VMs WF"
        unified_job_template: "Delete Managed VMs"
        state: present
        success_nodes:
          - Create_VMs

    # --------------------------------------------------------------------------
    # 2. Scan WF (Scan Advisory -> Send Slack Scan)
    # --------------------------------------------------------------------------
    - name: Create Workflow - Scan WF
      ansible.controller.workflow_job_template:
        name: "Scan WF"
        state: present
        organization: "{{ organization_name }}"
        labels:
          - "{{ label_scan }}"
        extra_vars:
          slack_webhook_url: "{{ slack_webhook_url }}"
          portal_url: "{{ portal_url }}"

    - name: Create Workflow Node - Send Slack Scan
      ansible.controller.workflow_job_template_node:
        identifier: Slack_Scan
        workflow_job_template: "Scan WF"
        unified_job_template: "Send Slack Scan"
        state: present

    - name: Create Workflow Node - Scan Advisory
      ansible.controller.workflow_job_template_node:
        identifier: Scan_Advisory
        workflow_job_template: "Scan WF"
        unified_job_template: "Scan Advisory"
        state: present
        success_nodes:
          - Slack_Scan

    # --------------------------------------------------------------------------
    # 3. Advisory List Publisher WF (Publish_Advisory -> Sync Project)
    # --------------------------------------------------------------------------
    - name: Create Workflow - Advisory List Publisher WF
      ansible.controller.workflow_job_template:
        name: "Advisory List Publisher WF"
        state: present
        organization: "{{ organization_name }}"
        labels:
          - "{{ label_patch }}"
        ask_variables_on_launch: true

    - name: Create Workflow Node - Sync Project
      ansible.controller.workflow_job_template_node:
        identifier: Sync_Project
        workflow_job_template: "Advisory List Publisher WF"
        unified_job_template: "{{ project_name }}"
        state: present

    - name: Create Workflow Node - Publish_Advisory
      ansible.controller.workflow_job_template_node:
        identifier: Publish_Advisory
        workflow_job_template: "Advisory List Publisher WF"
        unified_job_template: "Publish_Advisory"
        state: present
        success_nodes:
          - Sync_Project

    # --------------------------------------------------------------------------
    # 4. Apply Patch WF (1本道のパイプライン)
    # --------------------------------------------------------------------------
    - name: Create Workflow - Apply Patch WF
      ansible.controller.workflow_job_template:
        name: "Apply Patch WF"
        state: present
        organization: "{{ organization_name }}"
        labels:
          - "{{ label_patch }}"
        ask_variables_on_launch: true

    - name: Create Workflow Node - Scan Advisory (Apply Patch WF)
      ansible.controller.workflow_job_template_node:
        identifier: Scan_Advisory
        workflow_job_template: "Apply Patch WF"
        unified_job_template: "Scan Advisory"
        state: present

    - name: Create Workflow Node - Test App
      ansible.controller.workflow_job_template_node:
        identifier: Test_App
        workflow_job_template: "Apply Patch WF"
        unified_job_template: "Test App"
        success_nodes:
          - Scan_Advisory
        state: present

    - name: Create Workflow Node - Test VMs
      ansible.controller.workflow_job_template_node:
        identifier: Test_VMs
        workflow_job_template: "Apply Patch WF"
        unified_job_template: "Test VMs"
        success_nodes:
          - Test_App
        state: present

    - name: Create Workflow Node - Sync AWS Inventory Source2
      ansible.controller.workflow_job_template_node:
        identifier: Sync_Inventory_Source2
        workflow_job_template: "Apply Patch WF"
        unified_job_template: "{{ inventory_source }}"
        success_nodes:
          - Test_VMs
        state: present

    - name: Create Workflow Node - Reboot VMs
      ansible.controller.workflow_job_template_node:
        identifier: Reboot_VMs
        workflow_job_template: "Apply Patch WF"
        unified_job_template: "Reboot VMs"
        success_nodes:
          - Sync_Inventory_Source2
        state: present

    - name: Create Workflow Node - Apply Errata to VMs
      ansible.controller.workflow_job_template_node:
        identifier: Apply_Errata_to_VMs
        workflow_job_template: "Apply Patch WF"
        unified_job_template: "Apply Errata to VMs"
        success_nodes:
          - Reboot_VMs
        state: present

    - name: Create Workflow Node - Backup VMs
      ansible.controller.workflow_job_template_node:
        identifier: Backup_VMs
        workflow_job_template: "Apply Patch WF"
        unified_job_template: "Backup VMs"
        success_nodes:
          - Apply_Errata_to_VMs
        state: present

    - name: Create Workflow Node - Sync AWS Inventory Source
      ansible.controller.workflow_job_template_node:
        identifier: Sync_Inventory_Source
        workflow_job_template: "Apply Patch WF"
        unified_job_template: "{{ inventory_source }}"
        state: present
        success_nodes:
          - Backup_VMs

    # --------------------------------------------------------------------------
    # 5. Periodic Security Patching WF (全自動マスターワークフロー)
    # --------------------------------------------------------------------------
    - name: Create Workflow - Periodic Security Patching WF
      ansible.controller.workflow_job_template:
        name: "Periodic Security Patching WF"
        state: present
        organization: "{{ organization_name }}"
        labels:
          - "{{ label_patch }}"
        extra_vars:
          slack_webhook_url: "{{ slack_webhook_url }}"
          portal_url: "{{ portal_url }}"
          aap_host: "{{ aap_host }}"
          remediation_dataset_url: "{{ remediation_dataset_url }}"
        ask_variables_on_launch: true

    - name: Create Workflow Node - Send Slack Report
      ansible.controller.workflow_job_template_node:
        identifier: Slack_Report
        workflow_job_template: "Periodic Security Patching WF"
        unified_job_template: "Send Slack Report"
        state: present

    - name: Create Workflow Node - Apply Patch WF
      ansible.controller.workflow_job_template_node:
        identifier: Apply_Patch_WF
        workflow_job_template: "Periodic Security Patching WF"
        unified_job_template: "Apply Patch WF"
        success_nodes:
          - Slack_Report
        state: present

    - name: Create Workflow Node - Approval for Patching
      ansible.controller.workflow_job_template_node:
        identifier: Patch_Approval
        workflow_job_template: "Periodic Security Patching WF"
        approval_node:
          name: "Approval for Patching"
          description: "パッチ適用ジョブの実行を承認しますか？"
          timeout: 0
        state: present
        success_nodes:
          - Apply_Patch_WF

    - name: Create Workflow Node - Send Slack Launch
      ansible.controller.workflow_job_template_node:
        identifier: Slack_Launch
        workflow_job_template: "Periodic Security Patching WF"
        unified_job_template: "Send Slack Launch"
        success_nodes:
          - Patch_Approval
        state: present

    - name: Create Workflow Node - Advisory List Publisher WF
      ansible.controller.workflow_job_template_node:
        identifier: Advisory_List_Publisher_WF
        workflow_job_template: "Periodic Security Patching WF"
        unified_job_template: "Advisory List Publisher WF"
        state: present
        success_nodes:
          - Slack_Launch
