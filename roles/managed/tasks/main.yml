---
# tasks file for managed

- name: Fail if variables not defined
  ansible.builtin.assert:
    that:
      - rhsm_username is defined
      - rhsm_passwd is defined
      - mysql_root_passwd is defined
      - mysql_wp_user is defined
      - mysql_wp_passwd is defined
      - wp_archive_url is defined
      - wp_weblog_title is defined
      - wp_user_name is defined
      - wp_admin_password is defined
      - wp_allow_weak_pass is defined
      - wp_admin_email is defined
      - wp_blog_public is defined
    fail_msg: "Required variables not set"

# 1. RHSM への登録（dnf 用に必須）
- name: Register to Red Hat Subscription Management
  ansible.builtin.command:
    cmd: "subscription-manager register --username={{ rhsm_username }} --password={{ rhsm_passwd }} --force"
  become: true
  register: rhsm_register_result
  changed_when: rhsm_register_result.rc == 0
  failed_when: false

- name: Patch rhsm config
  ansible.builtin.command: subscription-manager config --rhsm.manage_repos=1
  become: true
  register: cmd_output
  changed_when: cmd_output.rc == 0

- name: Refresh rhsm config
  ansible.builtin.command: subscription-manager refresh
  become: true
  register: cmd_output
  changed_when: cmd_output.rc == 0
  notify: Dnf clean

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Install mysql and other related packages
  ansible.builtin.dnf:
    name:
      - mysql
      - mysql-server
      - wget
    state: present

- name: Install httpd package
  ansible.builtin.dnf:
    name:
      - httpd
      - mod_ssl
    state: present

- name: Install php packages
  ansible.builtin.dnf:
    name:
      - php
      - php-common
      - php-cli
      - php-pear
      - php-pdo
      - php-mysqlnd
      - php-gd
      - php-mbstring
      - php-xml
      - php-intl
      - php-zip
      - php-devel
    state: present

- name: Enable service mysql, and start
  ansible.builtin.service:
    name: mysqld
    enabled: true
    state: started

# ------------------------------------------------------------------------------
# MySQL 設定（community.mysql モジュールの代わりに CLI を使用）
# ------------------------------------------------------------------------------
- name: Set mysql root password
  ansible.builtin.shell: >
    mysqladmin -u root password "{{ mysql_root_passwd }}" ||
    mysql -u root -p"{{ mysql_root_passwd }}" -e "SELECT 1;"
  register: mysql_root_result
  changed_when: false
  failed_when: false

- name: Create Wordpress database and user
  ansible.builtin.shell: |
    mysql -u root -p"{{ mysql_root_passwd }}" -e "
      CREATE DATABASE IF NOT EXISTS {{ mysql_wp_database }};
      CREATE USER IF NOT EXISTS '{{ mysql_wp_user }}'@'localhost' IDENTIFIED BY '{{ mysql_wp_passwd }}';
      GRANT ALL PRIVILEGES ON {{ mysql_wp_database }}.* TO '{{ mysql_wp_user }}'@'localhost';
      FLUSH PRIVILEGES;
    "
  register: mysql_db_result
  changed_when: mysql_db_result.rc == 0

# ------------------------------------------------------------------------------
# SSL 証明書生成（community.crypto モジュールの代わりに openssl CLI を使用）
# ------------------------------------------------------------------------------
- name: Generate Self Signed OpenSSL certificate
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -nodes -days 365 -newkey rsa:2048
      -keyout /etc/pki/tls/private/server.key
      -out /etc/pki/tls/certs/server.crt
      -subj "/CN=www.demo.com"
    creates: /etc/pki/tls/certs/server.crt

- name: Modify SSLCertificateFile of /etc/httpd/conf.d/ssl.conf
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf.d/ssl.conf
    regexp: '^SSLCertificateFile'
    line: SSLCertificateFile /etc/pki/tls/certs/server.crt

- name: Modify SSLCertificateKeyFile of /etc/httpd/conf.d/ssl.conf
  ansible.builtin.lineinfile:
    path: /etc/httpd/conf.d/ssl.conf
    regexp: '^SSLCertificateKeyFile'
    line: SSLCertificateKeyFile /etc/pki/tls/private/server.key

# ------------------------------------------------------------------------------
# WordPress のセットアップ
# ------------------------------------------------------------------------------
- name: Download Wordpress archive
  ansible.builtin.command:
    cmd: wget -q "{{ wp_archive_url }}" -O /tmp/wordpress.tar.gz
    creates: /tmp/wordpress.tar.gz

- name: Extract Wordpress archive
  ansible.builtin.unarchive:
    src: /tmp/wordpress.tar.gz
    dest: /var/www/html
    remote_src: true
    owner: apache
    group: apache

- name: Copy wp-config.php file
  ansible.builtin.copy:
    src: /var/www/html/wordpress/wp-config-sample.php
    dest: /var/www/html/wordpress/wp-config.php
    remote_src: true
    owner: apache
    group: apache
    mode: '0644'

- name: Modify DB_NAME of /var/www/html/wordpress/wp-config.php
  ansible.builtin.replace:
    path: /var/www/html/wordpress/wp-config.php
    regexp: 'database_name_here'
    replace: "{{ mysql_wp_database }}"

- name: Modify DB_USER of /var/www/html/wordpress/wp-config.php
  ansible.builtin.replace:
    path: /var/www/html/wordpress/wp-config.php
    regexp: 'username_here'
    replace: "{{ mysql_wp_user }}"

- name: Modify DB_PASSWORD of /var/www/html/wordpress/wp-config.php
  ansible.builtin.replace:
    path: /var/www/html/wordpress/wp-config.php
    regexp: 'password_here'
    replace: "{{ mysql_wp_passwd }}"

- name: Enable service httpd, and start
  ansible.builtin.service:
    name: httpd
    enabled: true
    state: started

- name: Supply a configuration to the default site
  ansible.builtin.uri:
    url: "https://{{ inventory_hostname }}/wordpress/wp-admin/install.php?step=2"
    method: POST
    body_format: form-urlencoded
    body:
      weblog_title: "{{ wp_weblog_title }}"
      user_name: "{{ wp_user_name }}"
      admin_password: "{{ wp_admin_password }}"
      admin_password2: "{{ wp_admin_password }}"
      pw_weak: "{{ wp_allow_weak_pass }}"
      admin_email: "{{ wp_admin_email }}"
      blog_public: "{{ wp_blog_public }}"
      Submit: "Install WordPress"
      language: ""
    status_code: 200
    return_content: true
    validate_certs: false
  register: config_result

- name: Display WP configuration
  ansible.builtin.debug:
    var: config_result

- name: GET the default weblog
  ansible.builtin.uri:
    url: "https://{{ inventory_hostname }}/wordpress/"
    method: GET
    status_code: 200
    return_content: true
    validate_certs: false
  register: default_weblog_page

- name: Check for Site Name supplied in config
  ansible.builtin.fail:
    msg: "Site Check Failed - could not access default weblog {{ wp_weblog_title }}"
  when: default_weblog_page.content is not search(wp_weblog_title)

- name: Test Results
  ansible.builtin.debug:
    msg: "All tests succeeded."
