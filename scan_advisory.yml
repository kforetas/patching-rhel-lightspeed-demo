---
# Play 1: スキャン対象ホストで DNF スキャンを実行し、Advisory単位でグループ化して AAP 制御ノードに保存
- name: Scan RHEL vulnerabilities on managed hosts
  hosts: tag_type_managed
  become: true
  gather_facts: false

  tasks:
    # 1. 未適用のセキュリティアドバイザリを取得
    - name: Get available security advisories from DNF
      ansible.builtin.command: dnf updateinfo --list --security --available
      register: dnf_output
      changed_when: false

    # 2. Python で Advisory ID ごとにグループ化 & JST時刻・Environmentを埋め込み
    - name: Parse DNF output and build payload
      ansible.builtin.shell: |
        python3 -c '
        import sys, json, re
        from datetime import datetime, timezone, timedelta

        # JST 時刻の生成 (+9時間)
        jst = timezone(timedelta(hours=9))
        now_jst = datetime.now(jst).strftime("%Y-%m-%d %H:%M:%S JST")

        raw = """{{ dnf_output.stdout }}"""
        pattern = re.compile(r"(RHSA-\d+:\S+)\s+([\w]+)/Sec\.\s+(\S+)")
        advisories_map = {}

        for line in raw.splitlines():
            match = pattern.search(line)
            if match:
                advisory, severity, package = match.groups()
                if advisory not in advisories_map:
                    advisories_map[advisory] = {
                        "advisory_id": advisory,
                        "risk_rating": severity,
                        "packages": []
                    }
                if package not in advisories_map[advisory]["packages"]:
                    advisories_map[advisory]["packages"].append(package)

        env_tag = "{{ tags.environment | default('dev') }}".capitalize()

        payload = {
            "hostname": "{{ inventory_hostname }}",
            "environment": env_tag,
            "scan_time": now_jst,
            "vulnerabilities": list(advisories_map.values())
        }

        print(json.dumps(payload, indent=2))
        '
      register: parsed_json_payload
      changed_when: false

    # 3. AAP Runner 上に一時 JSON ファイルとして保存
    - name: Save JSON payload temporarily on AAP runner
      ansible.builtin.copy:
        content: "{{ parsed_json_payload.stdout }}"
        dest: "/tmp/{{ inventory_hostname }}.json"
        mode: "0644"
      delegate_to: localhost
      become: false


# Play 2: Streamlit サーバーへ copy モジュールで直接 JSON を配置
- name: Deploy JSON files to Streamlit Web Portal
  hosts: tag_Name_demo_web_portal
  become: false
  gather_facts: false

  tasks:
    - name: Copy generated JSON files to Streamlit data directory
      ansible.builtin.copy:
        src: "/tmp/{{ item }}.json"
        dest: "/home/ec2-user/data/{{ item }}.json"
        mode: "0644"
      loop: "{{ groups['tag_type_managed'] }}"

    - name: Cleanup temporary JSON files on AAP runner
      ansible.builtin.file:
        path: "/tmp/{{ item }}.json"
        state: absent
      delegate_to: localhost
      loop: "{{ groups['tag_type_managed'] }}"
