---
- name: Build RHEL advisory remediation dataset from Red Hat Lightspeed
  hosts: localhost
  gather_facts: false

  vars:
    token_url: "https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token"
    patch_api: "https://console.redhat.com/api/patch/v3"
    rh_client_id: "{{ lookup('env', 'RH_CLIENT_ID') }}"
    rh_client_secret: "{{ lookup('env', 'RH_CLIENT_SECRET') }}"

  tasks:
    - name: Get Red Hat API token
      ansible.builtin.uri:
        url: "{{ token_url }}"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ rh_client_id }}"
          client_secret: "{{ rh_client_secret }}"
        return_content: true
      register: rh_auth

    - name: Get first page of applicable security advisories
      ansible.builtin.uri:
        url: "{{ patch_api }}/advisories?limit=100&offset=0&filter[advisory_type_name]=security,other&filter[group_name]=in:Demo"
        method: GET
        headers:
          Authorization: "Bearer {{ rh_auth.json.access_token }}"
          Accept: "application/json"
        return_content: true
        status_code: 200
      register: advisories_first_page

    - name: Set advisory pagination information
      ansible.builtin.set_fact:
        advisory_page_size: 100
        advisory_total: "{{ advisories_first_page.json.meta.total_items | int }}"
        all_advisories: "{{ advisories_first_page.json.data | default([]) }}"

    - name: Calculate remaining advisory offsets
      ansible.builtin.set_fact:
        advisory_offsets: >-
          {{
            range(
              advisory_page_size | int,
              advisory_total | int,
              advisory_page_size | int
            )
            | list
          }}

    - name: Get remaining applicable security advisory pages
      ansible.builtin.uri:
        url: "{{ patch_api }}/advisories?limit={{ advisory_page_size }}&offset={{ item }}&filter[advisory_type_name]=security,other&filter[group_name]=in:Demo"
        method: GET
        headers:
          Authorization: "Bearer {{ rh_auth.json.access_token }}"
          Accept: "application/json"
        return_content: true
        status_code: 200
      loop: "{{ advisory_offsets }}"
      loop_control:
        label: "offset={{ item }}"
      register: advisories_remaining_pages

    - name: Combine all advisory pages
      ansible.builtin.set_fact:
        all_advisories: >-
          {{
            all_advisories
            +
            (
              advisories_remaining_pages.results
              | default([])
              | map(attribute='json.data')
              | flatten
            )
          }}

    - name: Extract and validate RHSA IDs
      ansible.builtin.set_fact:
        rhsa_ids: >-
          {{
            all_advisories
            | map(attribute='id')
            | select('match', '^RHSA-[0-9]{4}:[0-9]+$')
            | unique
            | sort
            | list
          }}

    - name: Show pagination result
      ansible.builtin.debug:
        msg:
          - "API total: {{ advisory_total }}"
          - "Pages requested: {{ 1 + (advisory_offsets | length) }}"
          - "Advisories collected: {{ all_advisories | length }}"
          - "Unique RHSA IDs: {{ rhsa_ids | length }}"

    - name: Get affected systems for each advisory
      ansible.builtin.uri:
        url: "{{ patch_api }}/advisories/{{ item | urlencode }}/systems?limit=100&offset=0&filter[group_name]=in:Demo"
        method: GET
        headers:
          Authorization: "Bearer {{ rh_auth.json.access_token }}"
          Accept: "application/json"
        return_content: true
        status_code: 200
      loop: "{{ rhsa_ids }}"
      loop_control:
        label: "{{ item }}"
      register: advisory_systems

    - name: Initialize remediation dataset
      ansible.builtin.set_fact:
        remediation_dataset: {}

    - name: Add advisories to each affected system
      ansible.builtin.set_fact:
        remediation_dataset: >-
          {{
            remediation_dataset
            | combine(
                {
                  hostname:
                    (
                      remediation_dataset.get(hostname, [])
                      + [advisory_id]
                    )
                    | unique
                    | list
                }
              )
          }}
      vars:
        advisory_id: "{{ item.0.item }}"
        hostname: "{{ item.1.attributes.display_name }}"
      loop: >-
        {{
          advisory_systems.results
          | subelements('json.data', skip_missing=true)
        }}
      loop_control:
        label: "{{ hostname }} <- {{ advisory_id }}"

#    - name: Write remediation dataset to YAML file
#      ansible.builtin.copy:
#        content: "{{ remediation_dataset | to_nice_yaml(indent=2, sort_keys=false) }}"
#        dest: "{{ remediation_dataset_file }}"
#        mode: "0644"

    - name: Pass remediation dataset to subsequent workflow jobs
      ansible.builtin.set_stats:
        data:
          remediation_dataset: "{{ remediation_dataset }}"
